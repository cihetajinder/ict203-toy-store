<!DOCTYPE html>
<html>
<head>
    <title>Happy Toys - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Happy Toys</h1>

        <button class="menu-button" id="menuButton">Menu</button>

        <nav id="navMenu">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="contact.html">Contact</a>
        </nav>
        <button id="darkModeButton">Dark Mode</button>
    </header>

    <main>

        <section>

            <h2>Contact Us</h2>

            <p>
                Contact Happy Toys if you have any questions about our products.
            </p>

            <p>Email: info@happytoys.com</p>
            <p>Phone: 0400 123 456</p>

        </section>

        <section>

            <h2>Send Us a Message</h2>

            <form id="contactForm">

                <label for="name">Name</label>
                <input type="text" id="name">

                <label for="email">Email</label>
                <input type="email" id="email">

                <label for="message">Message</label>
                <textarea id="message"></textarea>

                <button type="submit">Send Message</button>

                <p id="formMessage"></p>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Happy Toys</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
